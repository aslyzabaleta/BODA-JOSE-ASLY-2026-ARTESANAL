name: Publicar Invitación 2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: invitacion-2-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos estáticos de la invitación
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar invitación
        uses: actions/deploy-pages@v4
        id: deployment
